<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoQ — LOC to MediaStream</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1.5rem auto; }
    .row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; }
    video { width: 100%; max-height: 62vh; background: #000; border-radius: 6px; }
    pre { background: #121425; color: #e0e0e0; padding: 0.9rem; border-radius: 6px;
          font-size: 0.85rem; max-height: 34vh; overflow-y: auto; white-space: pre-wrap; }
    .stat { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>LOC Decode → MediaStream</h1>
  <p>
    Decodes LOC with WebCodecs, writes decoded video/audio into
    <code>MediaStreamTrackGenerator</code>, and plays through one
    <code>&lt;video&gt;</code> element (<code>srcObject</code>).
  </p>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
    <div class="stat" id="stats">idle</div>
  </div>
  <video id="video" controls muted autoplay playsinline></video>
  <pre id="log"></pre>
  <script type="module" src="main.ts"></script>
</body>
</html>
