<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playa — moqtail MSE sink</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; }
    .wrapper { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    .subtitle code { background: #222; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
    .player-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .controls { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    button {
      background: #333; color: #eee; border: 1px solid #555;
      padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    .state-badge {
      font-size: 0.8rem; padding: 3px 10px; border-radius: 12px;
      background: #333; color: #888;
    }
    .state-badge.playing { background: #1a3a1a; color: #4d4; }
    .state-badge.loading { background: #3a3a1a; color: #cc4; }
    .state-badge.error { background: #3a1a1a; color: #c44; }
    #log {
      background: #1a1a2e; padding: 12px 16px; border-radius: 8px;
      font-family: ui-monospace, monospace; font-size: 0.8rem;
      max-height: 240px; overflow-y: auto; white-space: pre-wrap;
      line-height: 1.5; margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Playa session + moqtail MSE</h1>
    <p class="subtitle">
      <code>@moqt/player</code> owns WebTransport, SETUP, catalog, and subscribe.
      Assembled CMAF segments are appended by moqtail’s <code>MseSource</code>.
      Requires a sibling <code>../moqtail</code> checkout. Pass
      <code>?url=</code>, <code>&amp;ns=</code>, and optionally <code>&amp;hash=</code> / <code>&amp;v=16</code>.
    </p>

    <div class="player-wrap">
      <video id="video" playsinline muted autoplay controls></video>
    </div>

    <div class="controls">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <span class="state-badge" id="state">idle</span>
    </div>

    <pre id="log"></pre>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
